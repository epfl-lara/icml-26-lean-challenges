name = "shadowbench_analysis_l2_ana_four_l2_001"
version = "0.1.0"
keywords = ["math", "autoformalization", "shadowbench"]
defaultTargets = ["ShadowBench"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
linter.style.whitespace = false
linter.style.cdot = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0"

[[lean_lib]]
name = "ShadowBench"

[[require]]
name = "repl"
git = "https://github.com/leanprover-community/repl"
rev = "v4.29.0"
